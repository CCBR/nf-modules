name: post-release

on:
  release:
    types:
      - published

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: CCBR/actions/post-release@latest
        with:
          github-token: ${{ github.token }}
          description-filepath: "" # this repo has a description file for R deps, but it is not actually an R package
          ccbr-actions-version: latest
