name: test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]
  workflow_dispatch:

# Cancel if a newer run is started
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NFT_DIFF: "pdiff"
  NFT_DIFF_ARGS: "--line-numbers --width 120 --expand-tabs=2"
  NFT_VER: "0.9.5"
  NFT_WORKDIR: "~"
  NXF_ANSI_LOG: false
  NXF_SINGULARITY_CACHEDIR: ${{ github.workspace }}/.singularity
  NXF_SINGULARITY_LIBRARYDIR: ${{ github.workspace }}/.singularity
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      pytest_modules: ${{ steps.pytest-filter.outputs.changes }}
      nf_test_modules: ${{ steps.nftest-filter.outputs.changes }}
      all_modules: ${{ steps.all-filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate filter files from repo structure
        run: |
          PYTEST_FILE="tests/config/pytest_modules_generated.yml"
          NFTEST_FILE="tests/config/nftest_modules_generated.yml"

          # Initialize with a placeholder so files are never empty (dorny/paths-filter requires non-empty YAML)
          printf '_placeholder:\n  - .github/PLACEHOLDER_NONEXISTENT\n' > "$PYTEST_FILE"
          printf '_placeholder:\n  - .github/PLACEHOLDER_NONEXISTENT\n' > "$NFTEST_FILE"

          # Detect test framework for each module
          while IFS= read -r main_nf; do
            module_dir=$(dirname "$main_nf")
            org=$(echo "$module_dir" | cut -d'/' -f2)
            rel_path=$(echo "$module_dir" | sed "s|modules/$org/||")
            if find "$module_dir/tests" -name '*.nf.test' 2>/dev/null | grep -q .; then
              printf '%s:\n  - modules/%s/%s/**\n\n' "$rel_path" "$org" "$rel_path" >> "$NFTEST_FILE"
            elif [ -f "tests/modules/$org/$rel_path/test.yml" ]; then
              printf '%s:\n  - modules/%s/%s/**\n  - tests/modules/%s/%s/**\n\n' \
                "$rel_path" "$org" "$rel_path" "$org" "$rel_path" >> "$PYTEST_FILE"
            fi
          done < <(find modules -name 'main.nf' -not -path '*/tests/*')

          # Detect test framework for each subworkflow
          while IFS= read -r main_nf; do
            swf_dir=$(dirname "$main_nf")
            org=$(echo "$swf_dir" | cut -d'/' -f2)
            rel_path=$(echo "$swf_dir" | sed "s|subworkflows/$org/||")
            key="subworkflows/$rel_path"
            if find "$swf_dir/tests" -name '*.nf.test' 2>/dev/null | grep -q .; then
              printf '%s:\n  - subworkflows/%s/%s/**\n\n' "$key" "$org" "$rel_path" >> "$NFTEST_FILE"
            elif [ -f "tests/subworkflows/$org/$rel_path/test.yml" ]; then
              printf '%s:\n  - subworkflows/%s/%s/**\n  - tests/subworkflows/%s/%s/**\n\n' \
                "$key" "$org" "$rel_path" "$org" "$rel_path" >> "$PYTEST_FILE"
            fi
          done < <(find subworkflows -name 'main.nf' -not -path '*/tests/*')

          # Combined file for linting all changed modules regardless of test framework
          ALL_FILE="tests/config/all_modules_generated.yml"
          cat "$PYTEST_FILE" "$NFTEST_FILE" > "$ALL_FILE"

          echo '=== pytest filters ===' && cat "$PYTEST_FILE"
          echo '=== nf-test filters ===' && cat "$NFTEST_FILE"

      - uses: dorny/paths-filter@v2
        id: pytest-filter
        with:
          filters: "tests/config/pytest_modules_generated.yml"
          token: "${{ secrets.GITHUB_TOKEN }}"

      - uses: dorny/paths-filter@v2
        id: nftest-filter
        with:
          filters: "tests/config/nftest_modules_generated.yml"
          token: "${{ secrets.GITHUB_TOKEN }}"

      - uses: dorny/paths-filter@v2
        id: all-filter
        with:
          filters: "tests/config/all_modules_generated.yml"
          token: "${{ secrets.GITHUB_TOKEN }}"

  nf-core-lint:
    runs-on: ubuntu-latest
    name: nf-core-lint
    needs: [changes]
    if: needs.changes.outputs.all_modules != '[]'
    strategy:
      fail-fast: false
      matrix:
        tags: ["${{ fromJson(needs.changes.outputs.all_modules) }}"]
        exclude:
          - tags: "nf-test"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install python requirements
        run: python -m pip install --upgrade pip -r tests/requirements.txt

      - name: Setup Nextflow
        uses: nf-core/setup-nextflow@v2

      - name: Lint module ${{ matrix.tags }}
        run: nf-core modules lint ${{ matrix.tags }}
        if: ${{ !startsWith(matrix.tags, 'subworkflows/') }}

      - name: Remove substring from matrix.tags
        id: remove_substring
        run: echo subworkflow_names=$(echo "${{ matrix.tags }}" | sed 's/subworkflows\///g') >> $GITHUB_OUTPUT

      - name: Lint subworkflow ${{ matrix.tags }}
        run: nf-core subworkflows lint ${{steps.remove_substring.outputs.subworkflow_names}}
        if: ${{ startsWith(matrix.tags, 'subworkflows/') }}

  pytest:
    runs-on: ubuntu-latest
    name: pytest
    needs: [changes]
    if: needs.changes.outputs.pytest_modules != '[]'
    strategy:
      fail-fast: false
      matrix:
        tags: ["${{ fromJson(needs.changes.outputs.pytest_modules) }}"]
        profile: ["docker"] #, "singularity", "conda"]
        NXF_VER:
          - "25.10.4"
    env:
      NXF_ANSI_LOG: false

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install python requirements
        run: python -m pip install --upgrade pip -r tests/requirements.txt

      - name: Setup Nextflow ${{ matrix.NXF_VER }}
        uses: nf-core/setup-nextflow@v2
        with:
          version: "${{ matrix.NXF_VER }}"

      - name: Set up Singularity
        if: matrix.profile == 'singularity'
        uses: eWaterCycle/setup-singularity@v7
        with:
          singularity-version: 3.7.1

      - name: Set up Singularity
        if: matrix.profile == 'singularity'
        run: |
          mkdir -p $NXF_SINGULARITY_CACHEDIR
          mkdir -p $NXF_SINGULARITY_LIBRARYDIR

      - name: Set up miniconda
        if: matrix.profile == 'conda'
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true
          channels: conda-forge,bioconda,defaults
          python-version: ${{ matrix.python-version }}

      - name: Conda setup
        if: matrix.profile == 'conda'
        run: |
          conda clean -a
          conda install -n base conda-libmamba-solver
          conda config --set solver libmamba

      # Test the module
      - name: Run pytest-workflow
        # only use one thread for pytest-workflow to avoid race condition on conda cache.
        run: TMPDIR=~ PROFILE=${{ matrix.profile }} pytest --tag ${{ matrix.tags }} --symlink --kwdof --git-aware --color=yes

      - name: Output log on failure
        if: failure()
        run: |
          sudo apt-get update > /dev/null
          sudo apt-get install bat > /dev/null
          batcat --decorations=always --color=always /home/runner/pytest_workflow_*/*/log.{out,err}

      - name: Setting global variables
        uses: actions/github-script@v6
        id: parsed
        with:
          script: |
            return '${{ matrix.tags }}'.toLowerCase().replaceAll(/\//g, '-').trim('-').trim('"')
          result-encoding: string

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v2
        with:
          name: logs-${{ matrix.profile }}-${{ steps.parsed.outputs.result }}
          path: |
            /home/runner/pytest_workflow_*/*/.nextflow.log
            /home/runner/pytest_workflow_*/*/log.out
            /home/runner/pytest_workflow_*/*/log.err
            /home/runner/pytest_workflow_*/*/work
            !/home/runner/pytest_workflow_*/*/work/conda
            !/home/runner/pytest_workflow_*/*/work/singularity
            !${{ github.workspace }}/.singularity

  nf-test:
    runs-on: ubuntu-latest
    name: nf-test
    needs: [changes]
    if: needs.changes.outputs.nf_test_modules != '[]'
    strategy:
      fail-fast: false
      matrix:
        tags: ["${{ fromJson(needs.changes.outputs.nf_test_modules) }}"]
        profile: ["docker"] #, "singularity", "conda"]
        NXF_VER:
          - "25.10.4"
    env:
      NXF_ANSI_LOG: false

    steps:
      - uses: actions/checkout@v7
      - name: Setup Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ matrix.NXF_VER }}

      - name: Install nf-test
        uses: nf-core/setup-nf-test@v2
        with:
          version: ${{ env.NFT_VER }}

      - name: Set up Singularity
        if: matrix.profile == 'singularity'
        uses: eWaterCycle/setup-singularity@v7
        with:
          singularity-version: 3.7.1

      - name: Set up Singularity
        if: matrix.profile == 'singularity'
        run: |
          mkdir -p $NXF_SINGULARITY_CACHEDIR
          mkdir -p $NXF_SINGULARITY_LIBRARYDIR

      - name: Set up miniconda
        if: matrix.profile == 'conda'
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true
          channels: conda-forge,bioconda,defaults
          python-version: ${{ matrix.python-version }}

      - name: Conda setup
        if: matrix.profile == 'conda'
        run: |
          conda clean -a
          conda install -n base conda-libmamba-solver
          conda config --set solver libmamba

      # Test the module
      - name: Run nf-test
        run: |
          nf-test test \
            --profile=${{ matrix.profile }} \
            --tag ${{ matrix.tags }} \
            --tap=test.tap

      - uses: pcolby/tap-summary@v1
        with:
          path: >-
            test.tap

      - name: Output log on failure
        if: failure()
        run: |
          sudo apt install bat > /dev/null
          batcat --decorations=always --color=always ${{ github.workspace }}/.nf-test/tests/*/meta/nextflow.log

  docs-changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            docs:
              - "docs/**"
              - "**.md"
              - "**.qmd"
              - "**/meta.yml"

  check-docs-render:
    needs: docs-changes
    if: ${{ needs.docs-changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: actions/setup-python@v3
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: docs/
      - name: Install Python packages
        run: |
          pip install --upgrade pip -r docs/requirements.txt
      - name: prerender
        run: |
          python docs/create-listings.py
      - name: Render without publishing
        uses: quarto-dev/quarto-actions/render@v2

  confirm-pass:
    runs-on: ubuntu-latest
    needs:
      [changes, nf-core-lint, pytest, nf-test, docs-changes, check-docs-render]
    if: always()
    steps:
      - name: All tests ok
        if: ${{ success() || !contains(needs.*.result, 'failure') }}
        run: exit 0
      - name: One or more tests failed
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: debug-print
        if: always()
        run: |
          echo "toJSON(needs) = ${{ toJSON(needs) }}"
          echo "toJSON(needs.*.result) = ${{ toJSON(needs.*.result) }}"
